<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Detector — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --card: #111827;
    --border: rgba(255,255,255,0.07);
    --accent: #00e5a0;
    --accent2: #3b82f6;
    --text: #f1f5f9;
    --muted: #64748b;
    --error: #f87171;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .left-panel {
    background: linear-gradient(135deg, #0f1f3d 0%, #0a0e1a 60%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }

  .left-panel::before {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,229,160,0.12) 0%, transparent 70%);
    top: -100px; left: -100px;
    border-radius: 50%;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 60px;
    letter-spacing: -0.5px;
    position: relative;
    z-index: 1;
  }

  .logo span { color: var(--text); }

  .feature-list {
    list-style: none;
    position: relative;
    z-index: 1;
    margin-top: 40px;
  }

  .feature-list li {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
    font-size: 15px;
    color: #94a3b8;
  }

  .feature-list li:last-child { border-bottom: none; }

  .feat-icon {
    width: 36px; height: 36px;
    background: rgba(0,229,160,0.1);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .hero-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 42px;
    line-height: 1.1;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }

  .hero-title em { font-style: normal; color: var(--accent); }

  .right-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    background: var(--bg);
  }

  .form-container { width: 100%; max-width: 400px; }

  .form-title {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .form-sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 36px;
  }

  .form-sub a { color: var(--accent); text-decoration: none; font-weight: 500; }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #0a0e1a;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--error);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
  }

  .success-msg {
    background: rgba(0,229,160,0.1);
    border: 1px solid rgba(0,229,160,0.3);
    color: var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
  }

  @media (max-width: 768px) {
    body { grid-template-columns: 1fr; }
    .left-panel { display: none; }
    .right-panel { padding: 40px 24px; }
  }
</style>
</head>
<body>

<div class="left-panel">
  <div class="logo">Traffic<span>AI</span></div>
  <h1 class="hero-title">Start detecting <em>instantly</em></h1>

  <ul class="feature-list">
    <li>
      <div class="feat-icon">🚗</div>
      Detect 11 Bangladeshi traffic classes
    </li>
    <li>
      <div class="feat-icon">📊</div>
      Personal detection history & stats
    </li>
    <li>
      <div class="feat-icon">⚡</div>
      YOLOv8s — fast inference on any image
    </li>
    <li>
      <div class="feat-icon">🔒</div>
      Secure account, your data stays yours
    </li>
  </ul>
</div>

<div class="right-panel">
  <div class="form-container">
    <h2 class="form-title">Create account</h2>
    <p class="form-sub">Already have one? <a href="/">Sign in</a></p>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <div class="field">
      <label>Full name</label>
      <input type="text" id="name" placeholder="Your name">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min. 6 characters">
    </div>

    <button class="btn" id="signup-btn" onclick="handleSignup()">Create account</button>
  </div>
</div>

<script>
  if (localStorage.getItem('token')) window.location.href = '/dashboard';

  async function handleSignup() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('signup-btn');

    if (!name || !email || !password) { showError('Please fill in all fields.'); return; }
    if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

    btn.disabled = true;
    btn.textContent = 'Creating account...';
    hideError();

    try {
      const res = await fetch('/api/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password })
      });

      const data = await res.json();
      if (!res.ok) { showError(data.detail || 'Signup failed'); return; }

      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));

      const succ = document.getElementById('success-msg');
      succ.textContent = 'Account created! Redirecting...';
      succ.style.display = 'block';

      setTimeout(() => window.location.href = '/dashboard', 1000);

    } catch (e) {
      showError('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Create account';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('error-msg').style.display = 'none';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSignup();
  });
</script>
</body>
</html>
