<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Detector — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --card: #111827;
    --border: rgba(255,255,255,0.07);
    --accent: #00e5a0;
    --accent2: #3b82f6;
    --text: #f1f5f9;
    --muted: #64748b;
    --error: #f87171;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  /* Left panel */
  .left-panel {
    background: linear-gradient(135deg, #0f1f3d 0%, #0a0e1a 60%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }

  .left-panel::before {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(0,229,160,0.12) 0%, transparent 70%);
    top: -100px; left: -100px;
    border-radius: 50%;
  }

  .left-panel::after {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
    bottom: -50px; right: -50px;
    border-radius: 50%;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--accent);
    margin-bottom: 60px;
    letter-spacing: -0.5px;
    position: relative;
    z-index: 1;
  }

  .logo span { color: var(--text); }

  .hero-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 48px;
    line-height: 1.1;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }

  .hero-title em {
    font-style: normal;
    color: var(--accent);
  }

  .hero-sub {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.7;
    max-width: 380px;
    position: relative;
    z-index: 1;
    margin-bottom: 48px;
  }

  .stats {
    display: flex;
    gap: 32px;
    position: relative;
    z-index: 1;
  }

  .stat-item { }
  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-label { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* Right panel */
  .right-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    background: var(--bg);
  }

  .form-container {
    width: 100%;
    max-width: 400px;
  }

  .form-title {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .form-sub {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 40px;
  }

  .form-sub a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .field {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .btn {
    width: 100%;
    background: var(--accent);
    color: #0a0e1a;
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
  }

  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.3);
    color: var(--error);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
  }

  @media (max-width: 768px) {
    body { grid-template-columns: 1fr; }
    .left-panel { display: none; }
    .right-panel { padding: 40px 24px; }
  }
</style>
</head>
<body>

<div class="left-panel">
  <div class="logo">Traffic<span>AI</span></div>
  <h1 class="hero-title">Detect <em>Dhaka</em> Traffic in Real-Time</h1>
  <p class="hero-sub">YOLOv8-powered vehicle and pedestrian detection trained on Bangladeshi traffic data. 11 classes including rickshaw, CNG, leguna and more.</p>
  <div class="stats">
    <div class="stat-item">
      <div class="stat-num">11</div>
      <div class="stat-label">Object classes</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">52%</div>
      <div class="stat-label">mAP50 score</div>
    </div>
    <div class="stat-item">
      <div class="stat-num">YOLOv8</div>
      <div class="stat-label">Architecture</div>
    </div>
  </div>
</div>

<div class="right-panel">
  <div class="form-container">
    <h2 class="form-title">Welcome back</h2>
    <p class="form-sub">Don't have an account? <a href="/signup">Sign up free</a></p>

    <div class="error-msg" id="error-msg"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="btn" id="login-btn" onclick="handleLogin()">Sign in</button>
  </div>
</div>

<script>
  // Redirect if already logged in
  if (localStorage.getItem('token')) window.location.href = '/dashboard';

  async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('error-msg');

    if (!email || !password) {
      showError('Please fill in all fields.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Signing in...';
    errEl.style.display = 'none';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.detail || 'Login failed');
        return;
      }

      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      window.location.href = '/dashboard';

    } catch (e) {
      showError('Network error. Please try again.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
