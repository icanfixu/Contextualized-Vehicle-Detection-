<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrafficAI — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--card:#111827;--card2:#161f30;--border:rgba(255,255,255,0.07);--accent:#00e5a0;--text:#f1f5f9;--muted:#64748b;--sw:240px}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}
.sidebar{width:var(--sw);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:28px 0;position:fixed;top:0;left:0;bottom:0;z-index:100}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--accent);padding:0 24px 32px;border-bottom:1px solid var(--border);margin-bottom:24px}
.logo span{color:var(--text)}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 24px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;transition:color .15s,background .15s}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.04)}
.nav-item.active{color:var(--accent);background:rgba(0,229,160,0.08);border-right:2px solid var(--accent)}
.sidebar-bottom{margin-top:auto;padding:20px 24px 0;border-top:1px solid var(--border)}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:rgba(0,229,160,0.15);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;color:var(--accent);font-size:14px;flex-shrink:0}
.user-info{flex:1;overflow:hidden}
.user-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-email{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logout-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px}
.main{margin-left:var(--sw);flex:1;padding:40px}
.page-title{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;margin-bottom:6px}
.page-sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-value{font-family:'Syne',sans-serif;font-size:30px;font-weight:700}
.stat-value.accent{color:var(--accent)}
.two-col{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
.section-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}
.chart-wrap{position:relative;height:210px}
.recent-list{display:flex;flex-direction:column;gap:8px}
.recent-item{display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--card2);border-radius:8px;cursor:pointer}
.recent-item:hover{background:rgba(255,255,255,0.05)}
.recent-thumb{width:48px;height:36px;border-radius:5px;object-fit:cover;background:var(--bg);flex-shrink:0}
.recent-info{flex:1}
.recent-count{font-size:13px;font-weight:500}
.recent-time{font-size:11px;color:var(--muted)}
.cong-badge{font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600;flex-shrink:0}
.empty-state{text-align:center;padding:30px 20px;color:var(--muted)}
.cta-btn{display:inline-block;background:var(--accent);color:#0a0e1a;border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;font-family:'Syne',sans-serif;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="logo">Traffic<span>AI</span></div>
  <a class="nav-item active" href="/dashboard">📊 Dashboard</a>
  <a class="nav-item" href="/detect">🔍 Detect</a>
  <a class="nav-item" href="/history">🕓 History</a>
  <a class="nav-item" href="/performance">📈 Performance</a>
  <div class="sidebar-bottom">
    <div class="user-chip">
      <div class="avatar" id="avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">Loading...</div>
        <div class="user-email" id="user-email"></div>
      </div>
      <button class="logout-btn" onclick="logout()">↩</button>
    </div>
  </div>
</aside>
<main class="main">
  <h1 class="page-title">Dashboard</h1>
  <p class="page-sub" id="greeting">Welcome back!</p>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Total scans</div><div class="stat-value accent" id="total-scans">—</div></div>
    <div class="stat-card"><div class="stat-label">Objects detected</div><div class="stat-value" id="total-objects">—</div></div>
    <div class="stat-card"><div class="stat-label">Model mAP50</div><div class="stat-value accent">52%</div></div>
    <div class="stat-card"><div class="stat-label">Classes</div><div class="stat-value">11</div></div>
  </div>
  <div class="two-col">
    <div class="section-card">
      <div class="section-title">Vehicle distribution heatmap</div>
      <div class="chart-wrap"><canvas id="heatmapChart"></canvas></div>
    </div>
    <div class="section-card">
      <div class="section-title">Recent scans <a class="cta-btn" href="/detect">+ New</a></div>
      <div id="recent-list"><p style="color:var(--muted);font-size:13px">Loading...</p></div>
    </div>
  </div>
</main>
<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/';
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  if (user.name) {
    document.getElementById('user-name').textContent = user.name;
    document.getElementById('user-email').textContent = user.email;
    document.getElementById('avatar').textContent = user.name.charAt(0).toUpperCase();
    document.getElementById('greeting').textContent = `Welcome back, ${user.name.split(' ')[0]}!`;
  }
  let chart = null;
  async function loadStats() {
    const res = await fetch('/api/stats', { headers: { 'Authorization': `Bearer ${token}` } });
    if (res.status === 401) { logout(); return; }
    const data = await res.json();
    document.getElementById('total-scans').textContent = data.total_scans;
    document.getElementById('total-objects').textContent = data.total_objects;
    const labels = Object.keys(data.class_heatmap);
    const values = Object.values(data.class_heatmap);
    const max = Math.max(...values, 1);
    const bg = values.map(v => `rgba(0,229,160,${Math.max(0.15, v/max * 0.85).toFixed(2)})`);
    const ctx = document.getElementById('heatmapChart').getContext('2d');
    if (chart) chart.destroy();
    chart = new Chart(ctx, {
      type: 'bar',
      data: { labels, datasets: [{ data: values, backgroundColor: bg, borderRadius: 4, borderSkipped: false }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.04)' } },
          y: { ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.04)' } }
        }
      }
    });
    const container = document.getElementById('recent-list');
    if (!data.recent_detections.length) {
      container.innerHTML = `<div class="empty-state"><p>No detections yet.</p><a class="cta-btn" href="/detect" style="margin-top:10px;display:inline-block">Start detecting</a></div>`;
      return;
    }
    const cc = { Low:'#639922', Moderate:'#BA7517', High:'#D85A30', Severe:'#E24B4A' };
    container.innerHTML = `<div class="recent-list">${data.recent_detections.map(d => `
      <div class="recent-item" onclick="window.location.href='/history'">
        <img class="recent-thumb" src="${d.result_image}" onerror="this.style.background='#1e2a3a'">
        <div class="recent-info"><div class="recent-count">${d.total_objects} objects</div><div class="recent-time">${d.created_at}</div></div>
        <span class="cong-badge" style="background:${cc[d.congestion_level]||'#888'}22;color:${cc[d.congestion_level]||'#888'}">${d.congestion_level}</span>
      </div>`).join('')}</div>`;
  }
  function logout() { localStorage.clear(); window.location.href = '/'; }
  loadStats();
</script>
</body>
</html>
